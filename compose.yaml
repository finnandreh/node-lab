services:
  node-red:
    build:
      context: .
      dockerfile: node-red/Dockerfile
    image: local/node-lab:2.0.0
    container_name: node-lab-example
    restart: "no"
    environment:
      NODE_LAB_EDITOR_ENABLED: "0"
      NODE_LAB_ALLOWED_ORIGIN: http://127.0.0.1:1880
      NODE_LAB_SOURCE_REVISION: ${NODE_LAB_SOURCE_REVISION:-development}
      NODE_LAB_SOURCE_ARCHIVE_SHA256: ${NODE_LAB_SOURCE_ARCHIVE_SHA256:-unavailable}
      NODE_LAB_IMAGE_ID: ${NODE_LAB_IMAGE_ID:-unavailable}
      NODE_LAB_RECORDING_PHASE: ${NODE_LAB_RECORDING_PHASE:-base-build}
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node_lab_example_data:/data
    networks:
      - node_lab_example_bridge
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "/opt/node-lab/seed/healthcheck.js"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"

volumes:
  node_lab_example_data:
    name: node_lab_example_data

networks:
  node_lab_example_bridge:
    name: node_lab_example_bridge
