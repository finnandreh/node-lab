apiVersion: battery-node-cloud/v1
kind: NodeTemplate
metadata:
  id: synthetic-temperature-node
  name: Node Lab live workshop emulation
  version: 2.0.0
spec:
  deviceId: synthetic-node-lab-001
  dashboardPath: /
  telemetry:
    topic: local/node-lab/live-workshop
    schema: telemetry.schema.json
    staleAfterSeconds: 5
    source: live-generated-emulation
  commands:
    viewer: []
    operator: []
    service: []
  safety:
    maxOutputOnSeconds: 1
    outputOffBeforeOta: true
    notes: No output or OTA command exists; public scenarios transform one response only and required safety fields are fail-closed.
  files:
    flows: node-red/flows.json
    settings: node-red/settings.js
    dockerfile: node-red/Dockerfile
